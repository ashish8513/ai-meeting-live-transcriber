# MeetScribe — Docker Compose
#
# Core (admin + auth + DB + UI):
#   docker compose up -d --build
#
# Full stack (+ NLP + ASR WebSocket/WebRTC):
#   docker compose --profile stack up -d --build
#
# Admin login (seeded on auth-api start): admin@meetscribe.com / Admin@123

name: meetscribe

services:
  postgres:
    image: postgres:16-alpine
    container_name: meetscribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetscribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetscribe}
      POSTGRES_DB: meetscribe
    ports:
      - "5432:5432"
    volumes:
      - meetscribe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetscribe -d meetscribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.auth
    container_name: meetscribe-auth
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      DATABASE_URL: postgresql+psycopg2://meetscribe:${POSTGRES_PASSWORD:-meetscribe}@postgres:5432/meetscribe
      JWT_SECRET: ${JWT_SECRET:-change-me-use-long-random-string-in-production}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@meetscribe.com}
      AUTH_API_PORT: "8200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  frontend:
    build:
      context: ./frontend_dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-http://localhost:8200}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8765}
        NEXT_PUBLIC_SIGNAL_URL: ${NEXT_PUBLIC_SIGNAL_URL:-http://localhost:8081/offer}
    container_name: meetscribe-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      auth-api:
        condition: service_healthy

  nlp:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: Dockerfile.nlp
    container_name: meetscribe-nlp
    restart: unless-stopped
    ports:
      - "8100:8100"

  asr:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: Dockerfile.railway
    container_name: meetscribe-asr
    restart: unless-stopped
    ports:
      - "8765:8765"
      - "8081:8081"
    environment:
      USE_LOCAL_MIC: "False"
      WHISPER_MODEL: ${WHISPER_MODEL:-base.en}
      ENABLE_WEBRTC_INGEST: "True"
      NLP_SERVICE_URL: http://nlp:8100
      AUTH_API_URL: http://auth-api:8200
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      SUMMARY_INTERVAL: ${SUMMARY_INTERVAL:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      auth-api:
        condition: service_healthy
      nlp:
        condition: service_started

volumes:
  meetscribe_pg_data:
