name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  backend-syntax-check:
    name: Backend Python syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python syntax check
        run: |
          python -m compileall .

  frontend-build:
    name: Frontend Next.js build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend_dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend_dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
